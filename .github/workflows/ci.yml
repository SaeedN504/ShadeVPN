name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      # gradlew was committed through the API, which cannot set the exec bit.
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon test lintDebug assembleDebug

  # The v1 `native` job is gone. Transport is supplied by the libbox AAR, so
  # there is no Rust crate and no NDK ABI matrix to build. See
  # docs/ARCHITECTURE.md, "Why v1 died".
