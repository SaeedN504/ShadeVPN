name: CI
on: [push, pull_request]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: ./gradlew test lintDebug assembleDebug
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android }
      - run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - run: cargo test --manifest-path native/Cargo.toml
