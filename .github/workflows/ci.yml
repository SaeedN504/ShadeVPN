name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      # No Gradle wrapper is committed (gradle-wrapper.jar is a binary that
      # cannot be added through the API), so CI provisions Gradle itself.
      # AGP 8.7.3 requires Gradle 8.9 or newer.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon test lintDebug assembleDebug
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android }
      - run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - run: cargo test --manifest-path native/Cargo.toml
