name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      # gradlew was committed through the API, which cannot set the exec bit.
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon test lintDebug assembleDebug
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android }
      - run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - run: cargo test --manifest-path native/Cargo.toml
